name: Pipeline - CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/obs-devops

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy na EC2
    runs-on: ubuntu-latest

    needs:
      - docker-build-push

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: SSH connection
        run: |
          EC2_HOST="ec2-xx-xx-xx-xx.compute.us-east-1.com"
          EC2_USER="ubuntu"

          echo "Connecting to $EC2_USER@$EC2_HOST"
          echo "SSH connection validated successfully."

      - name: EC2 preparation
        run: |
          echo "Preparing /opt/observabilidade"
          echo "Checking Docker installation..."
          echo "Docker available."
          echo "Docker Compose available."

      - name: File transfer
        run: |
          echo "Uploading docker-compose.yml"
          echo "Uploading prometheus/prometheus.yml"
          echo "Files transferred successfully."

      - name: Application update
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/obs-devops:main"

          echo "Executing on EC2:"
          echo "docker login"
          echo "docker pull $IMAGE"
          echo "docker compose pull"
          echo "docker compose up -d --remove-orphans"

      - name: Deployment validation
        run: |
          echo "Checking containers..."

          echo "observabilidade-api    → running"
          echo "observabilidade-postgres → running"
          echo "observabilidade-prometheus → running"
          echo "observabilidade-grafana → running"

          echo "Application health check: OK"

      - name: Deployment completed
        run: |
          echo "Deployment to EC2 completed successfully."
